name: Rust - CI
permissions:
  contents: read
  pull-requests: write

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Linting and formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 2026-10-16
        with:
          toolchain: nightly
          components: clippy, rustfmt
      - name: Clippy
        run: cargo clippy --workspace --all-features -- -D warnings
      - name: Format
        run: cargo fmt --all -- --check --verbose

  build:
    name: Test and build
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 2026-10-16
        with:
          toolchain: stable
      - name: Build
        run: cargo build --all-targets --all-features --workspace --verbose
      - name: Run tests
        run: cargo test --all-features --workspace --verbose

  miri:
    name: Miri
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 2026-10-16
        with:
          toolchain: nightly
          components: miri
      - name: Miri
        run: cargo miri test --workspace --verbose

  miri_s390x:
    name: Miri s390x (big endian)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 2026-10-16
        with:
          toolchain: nightly
          components: miri
          targets: s390x-unknown-linux-gnu
      - name: Miri
        run: cargo miri test --target=s390x-unknown-linux-gnu --workspace --verbose

  no_std:
    name: Build and run no_std
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 2026-10-16
        with:
          toolchain: nightly
          components: rust-src
      - name: Build
        shell: bash
        run: >-
          cargo build --manifest-path test_crates/nostd_compile/Cargo.toml
          -Z build-std=core,alloc --target "$(rustc --print host-tuple)"
      - name: Run
        shell: bash
        run: >-
          cargo run --manifest-path test_crates/nostd_compile/Cargo.toml
          -Z build-std=core,alloc --target "$(rustc --print host-tuple)"

  msrv:
    name: Verify MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 2026-10-16
        with:
          toolchain: 1.87.0
      - name: Build
        run: cargo build --all-targets --all-features --workspace --verbose
      - name: Run tests
        run: cargo test --all-features --workspace --verbose

  minimal_versions:
    name: Verify minimal versions of dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 2026-10-16
        with:
          toolchain: nightly
      - name: Install MSRV
        run: rustup toolchain add 1.87.0
      - name: Generate Cargo.lock
        run: cargo +nightly -Z minimal-versions update
      - name: Build
        run: cargo +1.87.0 build --all-features --workspace
      - name: Test
        run: cargo +1.87.0 test --all-features --workspace --verbose
