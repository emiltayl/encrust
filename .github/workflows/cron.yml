name: Rust - Periodic CI
permissions:
  contents: read

on:
  schedule:
    - cron: "20 17 16 * *"

env:
  CARGO_TERM_COLOR: always

jobs:
  nightly_checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    name: Periodic CI checks - ${{ matrix.os }} - nightly
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 2026-10-16
        with:
          toolchain: nightly
          components: clippy, rustfmt, miri, rust-src
      - name: Format
        run: cargo fmt --all -- --check --verbose
      - name: Clippy
        run: cargo clippy --workspace --all-features -- -D warnings
      - name: Build
        run: cargo build --all-targets --all-features --workspace --verbose
      - name: Run tests
        run: cargo test --all-features --workspace --verbose
      - name: Miri
        run: cargo miri test --workspace --verbose
      - name: Build no_std
        shell: bash
        run: >-
          cargo build --manifest-path test_crates/nostd_compile/Cargo.toml
          -Z build-std=core,alloc --target "$(rustc --print host-tuple)"
      - name: Run no_std
        shell: bash
        run: >-
          cargo run --manifest-path test_crates/nostd_compile/Cargo.toml
          -Z build-std=core,alloc --target "$(rustc --print host-tuple)"

  checks:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        toolchain: [1.87.0, stable]
    runs-on: ${{ matrix.os }}
    name: Periodic CI checks - ${{ matrix.os }} - ${{ matrix.toolchain }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 2026-10-16
        with:
          toolchain: ${{ matrix.toolchain }}
      - name: Build
        run: cargo build --all-targets --all-features --workspace --verbose
      - name: Run tests
        run: cargo test --all-features --workspace --verbose

  minimal_versions:
    name: Verify minimal versions of dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 2026-10-16
        with:
          toolchain: nightly
      - name: Install MSRV
        run: rustup toolchain add 1.87.0
      - name: Generate Cargo.lock
        run: cargo +nightly -Z minimal-versions update
      - name: Build
        run: cargo +1.87.0 build --all-features --workspace
      - name: Test
        run: cargo +1.87.0 test --all-features --workspace --verbose

  workflow-keepalive:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@f72ff1a1336129f29bf0166c0fd0ca6cf1bcb38c # v1.2.1

