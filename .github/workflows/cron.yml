name: Rust - Periodic CI
permissions:
  contents: read

on:
  schedule:
    - cron: "20 17 16 * *"

env:
  CARGO_TERM_COLOR: always

jobs:
  nightly_checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    name: Periodic CI checks - ${{ matrix.os }} - nightly
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # 2026-03-27
        with:
          toolchain: nightly
          components: clippy, rustfmt, miri
      - name: Format
        run: cargo fmt --all -- --check --verbose
      - name: Clippy
        run: cargo clippy --workspace --all-features -- -D warnings
      - name: Build
        run: cargo build --all-targets --all-features --workspace --verbose
      - name: Run tests
        run: cargo test --all-features --workspace --verbose
      - name: Miri
        run: cargo miri test --workspace --verbose
      - name: Build no_std
        run: cargo build --manifest-path test_crates/nostd_compile/Cargo.toml
      - name: Run no_std
        run: cargo run --manifest-path test_crates/nostd_compile/Cargo.toml

  checks:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        toolchain: [1.87.0, stable]
    runs-on: ${{ matrix.os }}
    name: Periodic CI checks - ${{ matrix.os }} - ${{ matrix.toolchain }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # 2026-03-27
        with:
          toolchain: ${{ matrix.toolchain }}
      - name: Build
        run: cargo build --all-targets --all-features --workspace --verbose
      - name: Run tests
        run: cargo test --all-features --workspace --verbose
      - name: Build no_std
        run: cargo build --manifest-path test_crates/nostd_compile/Cargo.toml
      - name: Run no_std
        run: cargo run --manifest-path test_crates/nostd_compile/Cargo.toml

  minimal_versions:
    name: Verify minimal versions of dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # 2026-03-27
        with:
          toolchain: nightly
      - name: Install MSRV
        run: rustup toolchain add 1.87.0
      - name: Generate Cargo.lock
        run: cargo +nightly -Z minimal-versions update
      - name: Build
        run: cargo +1.87.0 build --all-features --workspace
      - name: Test
        run: cargo +1.87.0 test --all-features --workspace --verbose

  workflow-keepalive:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@f72ff1a1336129f29bf0166c0fd0ca6cf1bcb38c # v1.2.1

