[package]
name = "encrust"
description = "Obfuscate data in memory to hide it until needed"
authors.workspace = true
categories.workspace = true
edition.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
encrust-core = { path = "../encrust-core", "version" = "0.3.2", default-features = false }
encrust-macros = { path = "../encrust-macros", "version" = "0.3.2", default-features = false, optional = true }

[dev-dependencies]
rand = { "version" = "0.10.1", default-features = false, features = ["thread_rng"] }

[features]
all = ["hashstrings", "macros"]
default = ["hashstrings", "macros"]
hashstrings = ["encrust-core/hashstrings", "encrust-macros?/hashstrings"]
macros = ["dep:encrust-macros", "encrust-core/macros"]

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true